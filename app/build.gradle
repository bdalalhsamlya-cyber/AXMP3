plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize' // لتفعيل @Parcelize في كلاس البيانات
    id 'kotlin-kapt'       // تمكين معالج كود Glide في الكوتلين
}

android {
    compileSdk 33
    namespace "com.axmp3"

    defaultConfig {
        applicationId "com.axmp3"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // تم تحديث التوافق إلى Java 11 لتتوافق مع إصدار ExoPlayer 2.19.1
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    // تحسين تغليف الملفات لمنع تعارض مكتبات الوسائط المتعددة
    packagingOptions {
        resources {
            excludes += 'META-INF/kotlin/**'
            excludes += '**/*.kotlin_module'
            excludes += 'META-INF/depends_on.toml'
        }
    }
}

dependencies {
    // مكتبات أندرويد الأساسية
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'

    // مكتبة Glide لجلب وعرض الصور المصغرة للأغاني والفيديوهات برمجياً
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    kapt 'com.github.bumptech.glide:compiler:4.15.1'

    // مكتبة ExoPlayer الحديثة والمستقرة لتشغيل الفيديوهات والموسيقى
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
}
